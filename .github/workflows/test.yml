name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge fmt
        run: forge fmt --check

      - name: Forge build
        run: forge build --sizes

      - name: Forge test
        run: forge test -vvv

      - name: Upload build artifacts for the web job
        uses: actions/upload-artifact@v4
        with:
          name: forge-out
          path: contracts/out
          retention-days: 1

  web:
    name: Web app + API
    runs-on: ubuntu-latest
    needs: contracts
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Download contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: forge-out
          path: contracts/out

      # shared/abis.ts and shared/deployments.ts are committed (Vercel builds without Foundry).
      # Regenerate them and fail if they differ: someone changed a contract and forgot `npm run sync`.
      - name: Generated ABIs are up to date
        run: |
          npm run sync
          git diff --exit-code -- shared/ || (echo "::error::shared/ is stale. Run 'npm run sync' in apps/web and commit." && exit 1)

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (game server rules)
        run: npm test

      - name: Build
        run: npm run build
